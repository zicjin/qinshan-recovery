<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>电子报告</title>
        <script type="text/javascript">
            function getPath() {
                var protocol = window.location.protocol;// 获取协议
                var host = window.location.host;// 获取地址和端口号
                return protocol+"//"+host;
            }
            function pdfJsView(fileId) {
                window.location.href= getPath() + "/static/plugin/pdfjs-3.5.141-dist/web/viewer.html?file=/open/emc/projectfunction/module/bp/report/reports/display/" + fileId;
            }
            function onlyOfficeView(fileId) {
                // todo
                window.location.href= getPath() + "";
            }
            function download(fileId) {
                // 直接下载
                window.location.href= getPath() + "/open/emc/projectfunction/module/bp/report/reports/display/" + fileId;
            }
            function batchDownload(fileIds) {
                // todo
                // 批量下载
            }
            // 判断文件格式，下载或预览
            function doFile(fileId,fileTxt) {
                // pdf进行预览 其他类型文件直接下载
                if (fileTxt == 'pdf') {
                    pdfJsView(fileId)
                } else {
                    download(fileId)
                }
            }



            window.onload = function(){ // dom完成后执行
                var pageUrl = window.location.href.toString();
                var reportId = pageUrl.substr(pageUrl.indexOf("=") + 1);
                // var url = "http://58.215.200.126:8090/open/emc/projectfunction/module/bp/report/reports/select-test-conclusion/" + reportId;
                var url = getPath() + "/open/emc/module/bp/report/reports/select-test-conclusion/" + reportId;
                var request = new XMLHttpRequest();
                request.open("GET",url);
                request.send(null);
                request.onload = function() {
                    console.log(request.response)
                    if(request.response == ''){
                        window.alert('未查询到可预览报告');
                    }else {
                        if (request.status == 200) {
                            // 获取响应
                            var jsonObject = JSON.parse(request.response);


                            // 渲染检验结论表格
                            // var testConclusion = jsonObject['testConclusion'];
                            var entrustOrgName = jsonObject['ext$']['entrustorgname'];
                            var reportNo = jsonObject['reportNo'];
                            var company = jsonObject['ext$']['ssgfgsmc']
                            var conclusion = {  entrustOrgName, reportNo };
                            var conclusionTable = document.getElementById("conclusionTable");
                            var conclusionName = {
                                reportNo : '报告编号',
                                entrustOrgName : '委托单位',
                            }
                            for (var key in conclusion) {
                                var tr = document.createElement('tr');
                                var th = document.createElement('th');
                                var td = document.createElement('td');
                                th.innerHTML = conclusionName[key];
                                td.innerHTML = conclusion[key] ? conclusion[key] : '暂无' ;
                                tr.appendChild(th);
                                tr.appendChild(td);
                                conclusionTable.insertBefore(tr,conclusionTable.children[0]);
                            }

                            //渲染欢迎语
                            var reportNoSpan = document.getElementById("reportNoSpan");
                            reportNoSpan.innerHTML = reportNo == undefined ? '' : reportNo;
                            //渲染公司
                            var reportCompany = document.getElementById("reportCompany");
                            reportCompany.innerHTML = company == undefined ? '青山绿水（江苏）检验检测有限公司' : company;
                            //渲染解释权
                            var reportCompany1 = document.getElementById("reportCompany1");
                            reportCompany1.innerHTML = company == undefined ? '青山绿水（江苏）检验检测有限公司' : company;
                            // 渲染文件列表
                            var fileList = jsonObject['fileList'];
                            var filesDiv = document.getElementById("filesDiv");
                            if (fileList.length == 0) {
                                var info = document.createElement("p");
                                info.innerHTML = '暂无文件';
                                filesDiv.appendChild(info);
                            }
                            for(var i = 0, len = fileList.length; i < len; i++) {
                                var {fileId, fileName, fileUrl,fileExt } = fileList[i];
                                var div = document.createElement("div");
                                div.setAttribute("class", "fileDivStyle");
                                div.setAttribute("onclick", "doFile('" + fileId + "','"+ fileExt +"')");

                                var leftImg = document.createElement('img');
                                var extName = fileExt;
                                if (fileExt == 'docx') {
                                    extName = 'doc'
                                }
                                leftImg.setAttribute("src", getPath() +"/static/emc/icon/file_ext_"+ extName +".png");//根据文件类型设置显示图片
                                leftImg.setAttribute("onerror","this.src='"+getPath()+"/static/emc/icon/file_ext_unknown.png'");//根据文件类型设置显示图片
                                leftImg.setAttribute("width","100");
                                leftImg.setAttribute("height","100");
                                var p = document.createElement("p");
                                p.innerHTML = fileName;
                                var rightImg = document.createElement('img');
                                rightImg.setAttribute("src", getPath() +"/static/emc/icon/rightArrow.png");
                                rightImg.setAttribute("width","40");
                                rightImg.setAttribute("height","40");

                                div.appendChild(leftImg);
                                div.appendChild(p);
                                div.appendChild(rightImg);
                                filesDiv.appendChild(div);
                            }
                        }
                    }
                }
            }

        </script>
