<script>
    var getData, setData;
    GC.Spread.Sheets.LicenseKey = 'sunway';
    var init = function (data, showHeader, callback) {
        if (!showHeader) {
            $(document).find('.fill-spread-content').css('top', '0px');
        }
        var designer = GC.Spread.Sheets.Designer;
        var spread = designer.wrapper.spread;
        if (!spread) {
            setTimeout(() => {
                init(data, showHeader, callback);
            }, 300);
            return;
        }
        getData = function () {
            var sheet = spread.getActiveSheet()
            sheet.showColumn(0, GC.Spread.Sheets.HorizontalPosition.left);
            sheet.showRow(0, GC.Spread.Sheets.VerticalPosition.top);
            return JSON.stringify(spread.toJSON());
        };
        setData = function (data) {
            data && spread.fromJSON(JSON.parse(data));
            spread.options.allowExtendPasteRange = true;
            var sheet = spread.getActiveSheet();
            sheet.options.rowHeaderVisible = true;
            sheet.options.colHeaderVisible = true;
            // 判断是否火狐浏览器，低版本滚动条滚动间距较大问题处理，高于14.1.1版本则把代码去掉
            // 第三方问题，把像素点数当成了单元格行数
            if(navigator.userAgent.indexOf('Firefox') > -1) {
                spread.options.scrollByPixel = true;
                spread.options.scrollPixel = 0.4;
            }
            if(sheet.getRowHeight(0) > 1){
	            sheet.addRows(0, 1);
	            sheet.setRowHeight(0, 1);
	            sheet.addColumns(0, 1);
	            sheet.setColumnWidth(0, 1);
            }
        };
        setData(data);
        
     // 绑定编辑结束事件，如果编辑内容是存在上下角标则进行修饰后显示
        designer.wrapper.spread.bind(spreadNS.Events.EditEnded, function (e, args) {
            var sheet = designer.wrapper.spread.getActiveSheet();
            var cv = sheet.getValue(args.row, args.col) + "";
            if (cv && !sheet.getFormula(args.row, args.col) && cv.indexOf) {
                var suba = '<sub>';
                var subb = '</sub>';
                var supa = '<sup>';
                var supb = '</sup>';
                var subai = cv.indexOf(suba);
                var subbi = cv.indexOf(subb);
                var supai = cv.indexOf(supa);
                var supbi = cv.indexOf(supb);
                if ((subai != -1 && subai < subbi) || (supai != -1 && supai < supbi)) {
                    sheet.suspendPaint();
                    var cell = sheet.getCell(args.row, args.col);
                    cell.cellType(new HTMLCellType());//指定是上下标单元格
                    
                    // 判断如果添加上标，则将高度设置为28
                    var tempHeight = sheet.getRowHeight(args.row, GC.Spread.Sheets.SheetArea.viewport);
                    var tempValue = cell.text();
                    if (cornermark === 'sub' || tempValue.indexOf('sub') !== -1) {
                        if (tempHeight < 28) sheet.setRowHeight(args.row, 28);
                    } else {
                        sheet.autoFitRow(args.row);
                    }
                    sheet.resumePaint();
                }
            }
        });

        callback && callback();
    }
</script>
