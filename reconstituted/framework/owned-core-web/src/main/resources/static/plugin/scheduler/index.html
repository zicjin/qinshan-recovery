<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <script src="common/jquery.js"></script>
    <script
      src="codebase/dhtmlxscheduler.js?v=5.3.4"
      type="text/javascript"
      charset="utf-8"
    ></script>
    <script
      src="codebase/locale/locale_cn.js"
      type="text/javascript"
      charset="utf-8"
    ></script>
    <script src="codebase/ext/dhtmlxscheduler_year_view.js"></script>
    <script src="codebase/ext/dhtmlxscheduler_tooltip.js?v=5.3.4"></script>
    <script src="codebase/ext/dhtmlxscheduler_limit.js?v=5.3.4" type="text/javascript" charset="utf-8"></script>
    <script src="codebase/ext/dhtmlxscheduler_serialize.js?v=5.3.4" type="text/javascript" charset="utf-8"></script>
    <link
      rel="stylesheet"
      href="codebase/dhtmlxscheduler_material.css?v=5.3.4"
      type="text/css"
      charset="utf-8"
    />
    <style>
      html,
      body {
        margin: 0px;
        padding: 0px;
        height: 100%;
        overflow: hidden;
      }

      .dhx_cal_event_line.custom,
      .dhx_cal_event.custom div {
        background-color: #9575cd;
      }

      .dhx_cal_event_clear.custom {
        color: #9575cd;
      }

      .dhx_year_box
        .dhx_year_grid
        .dhx_year_body
        table
        tbody
        td
        .dhx_month_head.one {
        background-color: #ffff00;
      }

      .dhx_year_box
        .dhx_year_grid
        .dhx_year_body
        table
        tbody
        td
        .dhx_month_head.two {
        background-color: #ffcc00;
      }

      .dhx_year_box
        .dhx_year_grid
        .dhx_year_body
        table
        tbody
        td
        .dhx_month_head.three {
        background-color: #ff9900;
      }

      .dhx_year_box
        .dhx_year_grid
        .dhx_year_body
        table
        tbody
        td
        .dhx_month_head.four {
        background-color: #ff6600;
      }

      .dhx_year_box
        .dhx_year_grid
        .dhx_year_body
        table
        tbody
        td
        .dhx_month_head.five {
        background-color: #ff3300;
      }

      .dhx_cal_tab.one {
        left: 10px !important;
        background-color: #ffff00;
        border: 0;
        cursor: unset;
      }

      .dhx_cal_tab.two {
        left: 101px !important;
        background-color: #ffcc00;
        border: 0;
        cursor: unset;
      }

      .dhx_cal_tab.three {
        left: 192px !important;
        background-color: #ff9900;
        border: 0;
        cursor: unset;
      }

      .dhx_cal_tab.four {
        left: 283px !important;
        background-color: #ff6600;
        border: 0;
        cursor: unset;
      }

      .dhx_cal_tab.five {
        left: 374px !important;
        background-color: #ff3300;
        border: 0;
        cursor: unset;
      }

      .dhx_year_tooltip {
        display: none;
      }

      .dhx_cal_navline .dhx_cal_date {
        padding-left: 50px;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 8px;
        background: rgba(187, 187, 187, 0.8);
      }

      .dhx_cal_ltext textarea {
        margin: 0;
      }

      .dhx_cal_ltext textarea:focus {
        border: 2px solid rgb(0, 96, 223);
        border-radius: 4px;
        outline: none !important;
      }
    </style>

    <script>
      if (top.Gikam.locale.toLocaleLowerCase() === "zh-cn") {
        var script = document.createElement("script");
        script.src = "codebase/locale/locale_cn.js";
        document.head.appendChild(script);
      } else {
        var script = document.createElement("script");
        script.src = "codebase/locale/locale_en.js";
        document.head.appendChild(script);
      }

      function init(value) {
	    if(!value) {
            return scheduler;
        }

        var dateValue = [];
        if (value && value.date) {
          dateValue = value.date.split("-");
        }
		if (value.readonly) {
            scheduler.config.readonly = true;
        }

        var date =
          value && value.date
            ? new Date(
                parseInt(dateValue[0]),
                parseInt(dateValue[1]) - 1,
                parseInt(dateValue[2])
              )
            : new Date();
        var view = value && value.view ? value.view : "month";
        //启用多日活动的呈现
        scheduler.config.multi_day = true;
        scheduler.config.showTime = value && value.showTime;
        //月视图
        scheduler.config.max_month_events = 5;
        scheduler.init("scheduler_here", date, view);
        if (view === "year") {
          //设置日程背景色，仅支持五个级别
          scheduler.templates.event_class = function (s, e, ev) {
            return ev.bgColor;
          };
          //隐藏日、周、月视图
          $(".dhx_cal_tab").css("display", "none");
          //显示等级色值和隐藏内容
          $(".color-level.one").css("display", "block").html("1-1");
          $(".color-level.two").css("display", "block").html("2-2");
          $(".color-level.three").css("display", "block").html("3-3");
          $(".color-level.four").css("display", "block").html("4-4");
          $(".color-level.five").css("display", "block").html("5-5");
        }
        return scheduler;
      }
    </script>
  </head>
  <body onload="init();">
    <div
      id="scheduler_here"
      class="dhx_cal_container"
      style="width: 100%; height: 100%"
    >
      <div class="dhx_cal_navline">
        <div class="dhx_cal_prev_button">&nbsp;</div>
        <div class="dhx_cal_next_button">&nbsp;</div>
        <div class="dhx_cal_today_button"></div>
        <div class="dhx_cal_date"></div>
        <div class="dhx_cal_tab" name="day_tab" style="right: 204px"></div>
        <div class="dhx_cal_tab" name="week_tab" style="right: 140px"></div>
        <div class="dhx_cal_tab" name="month_tab" style="right: 76px"></div>
        <div
          class="dhx_cal_tab one color-level"
          name="decade_tab"
          style="display: none"
        ></div>
        <div
          class="dhx_cal_tab two color-level"
          name="decade_tab"
          style="display: none"
        ></div>
        <div
          class="dhx_cal_tab three color-level"
          name="decade_tab"
          style="display: none"
        ></div>
        <div
          class="dhx_cal_tab four color-level"
          name="decade_tab"
          style="display: none"
        ></div>
        <div
          class="dhx_cal_tab five color-level"
          name="decade_tab"
          style="display: none"
        ></div>
      </div>
      <div class="dhx_cal_header"></div>
      <div class="dhx_cal_data"></div>
    </div>
  </body>
</html>
