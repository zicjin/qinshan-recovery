# External example only. Supply datasource, audit and identity settings in a
# private file; this example intentionally contains no credentials or endpoints.
server.address=127.0.0.1
server.port=8080
# Must match the artifact: original-db-link, direct-schema, or local-view.
# The local logical-clone build uses external-schema-runtime-profile-local-view.example.json.
owned.external-schema.access-mode=original-db-link
spring.main.banner-mode=off
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=5000
sunway.user.password.encoder.type=MD5
owned.identity.audit.type=file
owned.identity.audit.path=/tmp/lims-owned-audit.jsonl
# Explicit observed result-entry menu grants; replace only with a reviewed allowlist.
owned.identity.result-menu-ids=2023110301,1520
owned.identity.result-write-menu-ids=152001,152002,152004,152005
owned.result.write.mode=isolated
owned.identity.order-retain-menu-ids=151202,15120201,15120204
owned.identity.order-retain-write-menu-ids=15120202,15120203
owned.order-retain.write.mode=isolated
# Attachment metadata/read routes use the owned Java adapter.  Large file
# payloads still require an explicitly staged root in the deployment config.
owned.attachments.enabled=false
owned.attachments.root=/var/lib/lims-owned-attachments
owned.attachments.write.mode=isolated
# Observed supplier menu for 首页附件管理; deployments may override this allowlist.
owned.identity.attachment-menu-ids=9325
owned.erp.mode=disabled
owned.report.replay.mode=disabled
owned.scheduler.mode=disabled
