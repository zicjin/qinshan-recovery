<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <script type="text/javascript" src="../internal.js"></script>
    <style type="text/css">
        html,
        body {
            overflow: hidden;
        }

        #specharsTab {
            width: 97%;
            margin: 10px auto;
            zoom: 1;
            position: relative
        }

        .tabbody {
            height: 447px;
        }

        .tabbody span {
            position: relative;
            border: 1px solid transparent;
            margin: 5px 3px;
            text-align: center;
            display: inline-block;
            width: 40px;
            height: 16px;
            line-height: 16px;
            cursor: pointer;
        }

        .tabbody span:hover {
            border-color: #333;
        }

        .tabbody span:hover::before {
            position: absolute;
            z-index: 99;
            top: calc(50% - 20px);
            left: 0;
            transform: translateX(calc(100% + 5px));
            content: attr(data-content);
            width: 40px;
            border: 1px solid #888;
            font-size: 28px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background-color: #fff;
        }
        .tabbody span:nth-of-type(12n)::before{
            transform: translateX(calc(-100% - 5px));
        }
    </style>
</head>

<body>
    <div id="specharsTab">
        <div id="tabHeads" class="tabhead"></div>
        <div id="tabBodys" class="tabbody"></div>
    </div>
    <script type="text/javascript" src="spechars.js"></script>
</body>

</html>
