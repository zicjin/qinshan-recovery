<!DOCTYPE html>
<head>
<meta charset="UTF-8" />
<title>DhtmlxGantt</title>
<style>
html, body {
    height: 100%;
    padding: 0px;
    margin: 0px;
    overflow: hidden;
}

.complex_gantt_bar {
    background: transparent;
    border: none;
}

.complex_gantt_bar .gantt_task_progress {
    display: none;
}

/* 任务已完成时使用 */
.gantt_row_pink .gantt_cell, .odd.gantt_row_pink .gantt_cell, .gantt_row_pink .gantt_task_cell, .odd.gantt_row_pink .gantt_task_cell {
    background-color: #FDE0E0;
}

/* 任务未开启时使用 */
.gantt_row_gainsboro .gantt_cell, .odd.gantt_row_gainsboro .gantt_cell, .gantt_row_gainsboro .gantt_task_cell, .odd.gantt_row_gainsboro .gantt_task_cell {
    background-color: #DCDCDC;
}

/* 任务节点深红色 */
.gantt_task_fireBrick .gantt_task_content, .odd.gantt_task_fireBrick .gantt_task_content, .gantt_task_fireBrick .gantt_task_progress, .odd.gantt_task_fireBrick .gantt_task_progress {
    background-color: #B22222;
}

/* 上方按钮区 */
.gantt_control {
    background: #ededed;
    text-align: center;
}

.gantt_control input[type=button], .gantt_control input[type=file], .gantt_control input[type=checkbox], .gantt_control button {
    font: 500 14px Roboto;
    border: 1px solid #D9D9D9;
    border-radius: 2px;
    background: #fff;
    padding: 4px 12px;
    margin: 0 5px;
    color: rgba(0, 0, 0, 0.7);
    line-height: 20px;
}

.gantt_control input[type=button]:hover, .gantt_control button:hover {
    border: 1px solid #B3B3B3;
    color: rgba(0, 0, 0, 0.8);
    cursor: pointer;
}

.gantt_control input[type=button]:active, .gantt_control button:active {
    background: #F7F7F7;
}

.gantt_control input[type=button]:focus, .gantt_control button:focus {
    outline: none !important;
}

.gantt_control {
    padding: 5px 0 6px;
}

.gantt_control input[type=radio], .gantt_control input[type=checkbox] {
    display: none;
}

.gantt_control label {
    padding: 0 6px;
    color: rgba(0, 0, 0, 0.54);
    font: 14px Roboto;
    line-height: 20px;
    letter-spacing: 0.2px;
}
</style>
</head>

<body>
    <div id="gantt_here" style='width: 100%; height: 100%'></div>
    <script th:inline="javascript">
/*<![CDATA[*/
    
    var ganttLanguage = [[${#httpServletRequest.getLocale().getLanguage()}]];
    if (ganttLanguage == 'zh') {
        ganttLanguage = 'cn';
    }
    
    const IFM_CONTEXT = [[${#httpServletRequest.getScheme() + '://' + #httpServletRequest.getServerName() + ':' + #httpServletRequest.getServerPort()}]];
    /*]]>*/
</script>
    <script th:src="@{/static/plugin/jquery/jquery.min.js}"></script>
    <script th:src="@{/static/gikam/framework/js/gikam.js}"></script>
    <script th:src="@{/static/gikam/framework/js/gikam-extend.js}"></script>

    <script th:src="@{/static/plugin/dhtmlxgantt/dhtmlxgantt.js?v=6.1.1}"></script>
    <script th:src="@{/static/plugin/dhtmlxgantt/ext/dhtmlxgantt_marker.js?v=6.1.1}"></script>
    <script th:src="@{/static/plugin/dhtmlxgantt/ext/dhtmlxgantt_tooltip.js?v=6.1.1}"></script>
    <link rel="stylesheet" th:href="@{/static/plugin/dhtmlxgantt/dhtmlxgantt.css?v=6.1.1}" />
    <script th:inline="javascript">
/*<![CDATA[*/
    var localeUrl = '/static/plugin/dhtmlxgantt/locale/locale_' + ganttLanguage + '.js';
    
    var param = Gikam.getElParam([[${param}]]);
    Gikam.requirejs(new Array(decodeURI(param.ganttjsurl), localeUrl));
    
    dhtmlxGantt.init(param);
    /*]]>*/
</script>
</body>
