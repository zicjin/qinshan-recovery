<!DOCTYPE html>
<html lang='zh-cn'>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="renderer" content="webkit">
  <title>预览</title>
  <script src="../jquery/jquery.min.js"></script>
</head>

<body>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Tahoma, Arial, 'PingFang SC', 'Source Han Sans CN', 'Source Han Sans', 'Source Han Serif', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      line-height: 1.42857143;
      color: #3c4353;
      margin: 0;
    }

    @media (min-width: 1400px) {
      .container {
        padding: 0 40px;
      }
    }

    .container {
      max-width: 1800px !important;
      margin-right: auto;
      margin-left: auto;
      padding: 0 40px;
    }

    @media (min-width: 1800px) {
      container {
        max-width: 1760px;
      }
    }

    @media (min-width: 992px) {
      .container {
        max-width: 1760px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 972px;
      }
    }

    pre {
      display: block;
      padding: 9.5px;
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.38461538;
      color: #3c495c;
      word-break: break-all;
      word-wrap: break-word;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      white-space: pre-wrap;
    }

    #txtFile {
      padding: 5px 0;
      margin: 0 -10px;
    }

    #txtFile pre {
      margin: 0;
    }

    #txtFile div {
      overflow-x: auto;
    }

    #titlebar span {
      float: right;
      padding-right: 25px;
    }

    #mainContent {
      background-color: #fff;
      border-radius: 4px;
    }

    #main {
      margin: 20px 0;
    }
  </style>
  <main id="main">
    <div class="container">
      <div id='mainContent'>
        <div id='txtFile'>
          <pre id="textContent">
          </pre>
        </div>
      </div>
    </div>
  </main>
  <script th:inline="javascript">
  /*<![CDATA[*/
      var Gikam = parent.Gikam;
      var IFM_CONTEXT = Gikam.IFM_CONTEXT;
  /*]]>*/
  </script>
  <script>
    //获取url中的参数
    function getUrlParam(name) {
	  if(name === 'fileUrl') {
	    var r = window.location.search.replace('?fileUrl=','');
		if (r != null) return decodeURIComponent(r.split('&fileName')[0]);
		return null;
	  }

      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
      var r = window.location.search.substr(1).match(reg);
      if (r != null) return decodeURIComponent(r[2]);
      return null;
    }
    
    function getTxt(url) {
         return Gikam.jQuery.ajax({
            url: url,
            dataType: 'text',
            type: 'get',
            beforeSend:function() {},
        });
    }
    
  
  </script>
  <script>
    window.onload = function () {
      var fileUrl = getUrlParam('fileUrl');
      var fileName = getUrlParam('fileName');
      if (!fileUrl) return
      document.title = fileName;
      getTxt(Gikam.getFileContextUrl(fileUrl)).done(function(data) {
          $('#textContent').text(Gikam.$xss(data));
      });
    }
  </script>
</body>

</html>
