<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8" />
<style>
html, body, #main {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>
    <div id="main"></div>
</body>

<script th:inline="javascript">
/*<![CDATA[*/
    const IFM_CONTEXT = [[${#httpServletRequest.getScheme() + '://' + #httpServletRequest.getServerName() + ':' + #httpServletRequest.getServerPort()}]];
/*]]>*/
</script>
<script th:src="@{/static/plugin/jquery/jquery.min.js}"></script>
<script th:src="@{/static/gikam/framework/js/gikam.js}"></script>
<script th:src="@{/static/gikam/framework/js/gikam-extend.js}"></script>
<script th:src="@{/static/plugin/echarts/echarts.min.js}"></script>

<script th:inline="javascript">
/*<![CDATA[*/
    
var PieChart = function() {
    
    var parent = {
            
        defaultOptions : {
            title : void 0,
            subTitle : void 0,
            renderTo : void 0,
            data : [{
                text : void 0,
                value : void 0
            }]
        },
        
        privateProperties : {
            chart : void 0
        },
        
        create : function() {
            this.chart = echarts.init(document.getElementById('main'), null, {
                renderer: 'svg'
            });
            window.onresize = this.chart.resize;
            return this;
        },
        
        setData : function(data) {
            if (Gikam.isEmpty(this.options.data) && Gikam.isEmpty(data)) {
                return;
            }
            if (Gikam.isNotEmpty(data)) {
                Gikam.extend(true, this.options, data);
            }
            this.chart.setOption({
                animation: 'auto',
                label:{
                    show : true,
                    formatter: '{b} : {c} ({d}%)'
                },
                animationDuration: Gikam.emptyFunction,
                title : {
                    text: this.options.title,
                    subtext: this.options.subTitle,
                    x:'center'
                },
                tooltip : {
                    trigger: 'item',
                    formatter: "{a} <br/>{b} : {c} ({d}%)"
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    data : this.options.data.map(function(item) {
                        return item.text;
                    })
                },
                series : [
                    {
                        name: '比重',
                        type: 'pie',
                        radius : '55%',
                        center: ['50%', '60%'],
                        data : this.options.data.map(function(item) {
                            return {
                                value : item.value,
                                name : item.text
                            }
                        }),
                        itemStyle: {
                            emphasis: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }
                ]
            });
        },
        
        init : function() {
            this.create().setData();
        }
    };
    
    var PieChart = function(param) {
        this.initialize(param).init();
    };
    
    return Gikam.setPrototype(PieChart, Gikam.deepExtend(Gikam.component.Base, parent));
}();

var BarChart = function() {
    
    var parent = {
            
        setData : function(data) {
            if (Gikam.isEmpty(this.options.data) && Gikam.isEmpty(data)) {
                return;
            }
            
            if (Gikam.isNotEmpty(data)) {
                Gikam.extend(true, this.options, data);
            }
            
            this.chart.setOption({
                title : {
                    text: this.options.title,
                    subtext: this.options.subTitle,
                    x:'center'
                },
                color: ['#3398DB'],
                label:{
                    show : true
                },
                tooltip : {
                    trigger: 'axis',
                    axisPointer : {
                        type : 'shadow'
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis : [
                    {
                        type : 'category',
                        data : this.options.data.map(function(item) {
                            return item.text;
                        }),
                        axisTick: {
                            alignWithLabel: true
                        }
                    }
                ],
                yAxis : [
                    {
                        type : 'value'
                    }
                ],
                series : [
                    {
                        name:'',
                        type:'bar',
                        barWidth: '60%',
                        data : this.options.data.map(function(item) {
                            return item.value;
                        })
                    }
                ]
            });
        }
    };
    
    var BarChart = function(param) {
        this.initialize(param).init();
    };
    
    return Gikam.setPrototype(BarChart, Gikam.deepExtend(PieChart.prototype, parent));
}();

var createChart = function(type, param) {
    return new window[type](param);
};
/*]]>*/
</script>


</html>
