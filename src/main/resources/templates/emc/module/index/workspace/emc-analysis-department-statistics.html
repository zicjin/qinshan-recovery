<th:block th:replace="module/gikam/workspace" />

<!-- 引入项目自定义下拉框和choose选择框配置 -->
<script th:src="@{/static/emc/config/emc-select-config.js}"></script>
<script>

    Date.prototype.format = function(fmt) { //author: meizz 
        var o = {
            "M+" : this.getMonth() + 1, //月份 
            "d+" : this.getDate(), //日 
            "h+" : this.getHours(), //小时 
            "m+" : this.getMinutes(), //分 
            "s+" : this.getSeconds(), //秒 
            "q+" : Math.floor((this.getMonth() + 3) / 3), //季度 
            "S" : this.getMilliseconds()
        //毫秒 
        };
        if (/(y+)/.test(fmt))
            fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
        for ( var k in o)
            if (new RegExp("(" + k + ")").test(fmt))
                fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
        return fmt;
    }

    var lastDate = new Date();
    lastDate.setDate(lastDate.getDate() - 6);

    var startTime = lastDate.format('yyyy-MM-dd');
    var endTime = new Date().format('yyyy-MM-dd');

    var analysisOrg = null;
    var echarts = null;
    function setData() {
        if (!Gikam.isEmpty(startTime) && !Gikam.isEmpty(endTime) && !Gikam.isEmpty(analysisOrg)) {
            Gikam.post(IFM_CONTEXT + '/secure/emc/module/bp/bp/order-tasks/analysis-department-statistics/queries', Gikam.getJsonWrapper({
                f : {
                    ANALYSISORGID_SB : analysisOrg,
                    ANALYSISDATE_DGOE : startTime,
                    ANALYSISDATE_DLOE : endTime,
                }
            }, [ '', [] ])).done(function(items) {
                var rows = items.rows;
                var analysisDates = getAllDate(startTime, endTime);
                var testCounts = [];

                var result = {};

                Gikam.each(rows, function(index, row) {
                    result[row.analysisDate] = row.ext$.testcount;
                });

                Gikam.each(analysisDates, function(index, analysisDate) {
                    testCounts.push(Gikam.isEmpty(result[analysisDate]) ? 0 : result[analysisDate]);
                });

                echarts && echarts.setOption({
                    xAxis : [ {
                        data : analysisDates
                    } ],
                    series : [ {
                        data : testCounts
                    } ]
                });
            });
        }

    };

    Gikam.create('echarts', {
        renderTo : document.body,
        type : 'echarts',
        id : 'emc-analysis-department-statistics-echarts',
        onReady : function() {
            echarts = Gikam.getComp('emc-analysis-department-statistics-echarts');
            analysisOrg = Gikam.getComp('emc-analysis-department-statistics-form').getData().analysisOrg;
            setData();
        },
        config : {
            search : {
                titleWidthAuto : true,
                type : 'form',
                id : 'emc-analysis-department-statistics-form',
                columns : 4,
                fields : [ {
                    title : '开始时间',
                    field : 'startTime',
                    type : 'date',
                    width : 200,
                    onChange : function(field, value) {
                        startTime = value;
                        setData();
                    },
                }, {
                    title : '结束时间',
                    field : 'endTime',
                    type : 'date',
                    width : 200,
                    onChange : function(field, value) {
                        endTime = value;
                        setData();
                    },
                }, {
                    title : '分析科室',
                    field : 'analysisOrg',
                    width : 200,
                    type : 'select',
                    search : true,
                    onChange : function(field, value, rowIndex, oldValue, text) {
                        analysisOrg = value;
                        setData();
                    },
                } ],
                onBeforeUpdate : function() {
                    return false;
                },
                onRendered : function() {
                    Gikam.post('/secure/core/module/mdm/user-permissions/login-org/queries/post-selectable').done(function(rows) {
                        var items = rows.map(function(item) {
                            return {
                                text : item.ext$.orgname,
                                value : item.targetId
                            };
                        });
                        Gikam.getComp('emc-analysis-department-statistics-form').setSelectOptions('analysisOrg', items, true);
                        Gikam.getComp('emc-analysis-department-statistics-form').setData({
                            analysisOrg : !Gikam.isEmpty(items[0].value) ? items[0].value : "",
                            startTime : startTime,
                            endTime : endTime
                        });
                    });
                },
            },
        },
        option : {
            xAxis : {
                type : 'category',
                axisLine : {
                    show : false
                },
                axisTick : {
                    show : false
                },
                boundaryGap : true,
                nameLocation : 'start',
                data : [],
                axisLabel : {
                    formatter : function(r) {
                        return r;
                    }
                }
            },
            yAxis : {
                type : 'value',
                axisLine : {
                    show : false,
                },
                axisTick : {
                    show : false
                },
                splitLine : {
                    lineStyle : {
                        color : '#eee',
                        type : 'dashed'
                    }
                },
                minInterval : 1
            },
            series : [ {
                data : [],
                type : 'line',
                areaStyle : {
                    color : 'rgba(81, 207, 160, 0.5)'
                }
            } ],
            color : [ '#51CFA0' ],
            tooltip : {
                show : true,
                trigger : 'axis',
                formatter : function(data) {
                    return (data[0]['name'] + '' + '</br>测试数量: ' + data[0]['value'])
                }
            },
            grid : {
                left : 50,
                right : 50,
                top : 18,
                bottom : 40
            }
        },
    });

    function random(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
    }

    function getAllDate(start, end) {

        var date_all = [], i = 0;
        var startTime = getDate(start);
        var endTime = getDate(end);
        while ((endTime.getTime() - startTime.getTime()) >= 0) {
            var year = startTime.getFullYear();
            var month = (startTime.getMonth() + 1).toString().length == 1 ? "0" + (startTime.getMonth() + 1).toString() : (startTime.getMonth() + 1).toString();
            var day = startTime.getDate().toString().length == 1 ? "0" + startTime.getDate() : startTime.getDate();
            date_all[i] = year + "-" + month + "-" + day;
            startTime.setDate(startTime.getDate() + 1);
            i += 1;
        }
        return date_all;

    }

    function getDate(datestr) {
        var temp = datestr.split("-");

        var date = new Date(temp[0], temp[1] - 1, temp[2]);
        return date;
    }
</script>
