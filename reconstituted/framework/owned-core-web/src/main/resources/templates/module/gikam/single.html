<script th:inline="javascript">
/*<![CDATA[*/
    (function(win) {
        var servletContext = /*[[@{/}]]*/'';
        if (servletContext !== '') {
            servletContext = servletContext.replace(/\/$/,'');
        }
        win.IFM_CONTEXT = location.origin + servletContext;
    })(window);
/*]]>*/
</script>

<script th:inline="javascript">
    /*<![CDATA[*/

    var IndexPage = function(options) {
        var pageParam = Gikam.getElParam([[${param}]])['page-params'];
        if(pageParam) {
            try {
                pageParam = JSON.parse(decodeURIComponent(pageParam));
            } catch {
                pageParam= {};
            }
        }

        this.initWindow = function() {
            this.window = Gikam.create('window', {
                renderTo : document.body,
                title : (options && options.title) ? options.title : null
            });
            options && options.url && this.window.loadPage(options.url, pageParam);
            Gikam.window = this.window;
        };

        this.initI18N = function() {
            return Gikam.component.FrontI18N.init(Gikam.locale);
        };

        this.init = function() {
            var _this = this;
            window.workspace = this;
            Gikam.getJson(Gikam.IFM_CONTEXT + '/secure/core/module/lcdp/global-configs/SYS_CLIENT_JS/content').then(function(data) {
                eval(data.content);
                return Gikam.getJson(Gikam.IFM_CONTEXT + '/secure/core/module/lcdp/global-comp-configs');
            }).then(function(comps) {
                Gikam.setCompConfig(comps, true);
                return Gikam.getText(Gikam.IFM_CONTEXT + '/core/module/sys/logins/account');
            }).then(function(result) {
                var user = JSON.parse(result);
                window.workspace.user = user;
                Gikam.loginUser = user;
                if (user.ext$ && user.ext$.roles) {
                    var roles = JSON.parse(user.ext$.roles);
                    user.roles = roles.map(function(role) {return role.roleId;} );
                }
                _this.initI18N().then(function() {
                    _this.initWindow();
                })
            })
        };

        this.init();

        return this;
    };

    /*]]>*/
</script>
