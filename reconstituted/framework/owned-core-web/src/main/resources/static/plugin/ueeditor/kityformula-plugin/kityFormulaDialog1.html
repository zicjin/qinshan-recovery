<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <link rel="stylesheet" href="kityformula/assets/styles/base.css">
    <link rel="stylesheet" href="kityformula/assets/styles/ui.css">
    <link rel="stylesheet" href="kityformula/assets/styles/scrollbar.css">
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
        }

        .kf-editor {
            width: 780px;
            height: 380px;
            margin: auto;
        }

        #loading {
            height: 32px;
            width: 340px;
            line-height: 32px;
            position: absolute;
            top: 42%;
            left: 50%;
            margin-left: -170px;
            font-family: arial, "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
        }

        #loading img {
            position: absolute;
        }

        #loading p {
            display: block;
            position: absolute;
            left: 40px;
            top: 0px;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="kfEditorContainer" class="kf-editor"> </div>
</body>

<script src="kityformula/js/jquery.min.js"></script>
<script src="kityformula/js/kitygraph.all.js"></script>
<script src="kityformula/js/kity-formula-render.all.js"></script>
<script src="kityformula/js/kity-formula-parser.all.min.js"></script>
<script src="kityformula/js/kityformula-editor.all.min.js"></script>
<script>

    let value;

    var factory = kf.EditorFactory.create($("#kfEditorContainer")[0], {
        render: {
            fontsize: 24
        },
        resource: {
            path: "./kityformula/resource/"
        }
    });

    factory.ready(function (KFEditor) {
        this.execCommand("render", value || "\\placeholder");
        this.execCommand("focus");
        window.kfe = this;
    });

    window.getData = function () {
        return $('.kf-editor-canvas-container').children().
            attr('value', kfe.execCommand('get.source')).end().html();
    };

    window.setData = function (val) {
        return value = val;
    };

    window.transform2Base64 = function () {
        var mySvg = $('.kf-editor-canvas-container').children()[0];
        svgCon = mySvg.outerHTML;

        //svg转base64;
        href = 'data:image/svg+xml;base64,' + window.btoa(unescape(encodeURIComponent(svgCon)))
        image = new Image();
        image.src = href;

        //添加svg转base64格式的图片
        var svgImg = document.createElement('img');
        svgImg.src = href;
        document.body.appendChild(image);

        /* //下载svg图片
        var svgLink = document.createElement('a');
        svgLink.download = "image.svg";
        svgLink.href = href;
        svgLink.innerHTML = '下载svg图片'
        document.body.appendChild(svgLink); */

        image.onload = function () {
            var canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            var context = canvas.getContext('2d');
            context.drawImage(image, 0, 0);


            //svg转png的base64编码;
            var imgDataUri = canvas.toDataURL('image/png');
            console.log(imgDataUri);
            //添加svg转base64格式的png图片
            var pngImg = document.createElement('img');
            pngImg.src = imgDataUri;
            document.body.appendChild(pngImg)

            //下载png图片
            var a = document.createElement('a');
            a.download = "image.png";
            a.href = imgDataUri;
            a.innerHTML = '下载png图片'
            document.body.appendChild(a);

            //svg转jpg的base64编码;
            var jpgDataUri = canvas.toDataURL('image/jpeg', 1);
            console.log(jpgDataUri)


            //添加svg转base64格式的jpg图片
            var jpgImg = document.createElement('img');
            jpgImg.src = jpgDataUri;
            document.body.appendChild(jpgImg)

            //下载jpg图片
            var a = document.createElement('a');
            a.download = "image.jpeg";
            a.href = jpgDataUri;
            a.innerHTML = '下载jpg图片'
            document.body.appendChild(a);
        }
    }

</script>

</html>
