
<th:block th:replace="module/gikam/single" />

<script th:inline="javascript">

(function() {
    var param = Gikam.getElParam([[${param}]]);
    window['lcdp-env'] = 'development';

    Gikam.jQuery.ajaxSetup({
        beforeSend(xhr) {
            xhr.setRequestHeader('lcdp-env', 'development');
            xhr.setRequestHeader('lcdp-data-env', 'development');
        }
    });

    new IndexPage({url: param.id});
})()

</script>
