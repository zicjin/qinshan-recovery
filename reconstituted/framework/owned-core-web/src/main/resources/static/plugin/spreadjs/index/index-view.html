<script>
    var getData, setData, exportImg, image, scaleSheet;
    GC.Spread.Sheets.LicenseKey = 'sunway';
    var init = function (option, callback) {
        var designer = GC.Spread.Sheets.Designer;
        var spread = designer.wrapper.spread;
        if (!spread) {
            setTimeout(() => {
                init(option, callback);
            }, 300);
            return;
        }
        
     /*    var TopRowChanged = GC.Spread.Sheets.Events.TopRowChanged;
        spread.bind(TopRowChanged, function () {
            spread.getActiveSheet().showRow(0);
        }); */
        
        var cellClick = GC.Spread.Sheets.Events.CellClick;
        spread.bind(cellClick, option.clickComp);
        
        var CellDoubleClick = GC.Spread.Sheets.Events.CellDoubleClick;
        spread.bind(CellDoubleClick, function () {
            option.editEvent && option.editEvent();
        });

        exportImg = function () {
            return image;
        };
        
        getSpreadHeight = function (rows, rowCount) {
            const sheet = spread.getActiveSheet()
            let differentHeight = 0
            const rowStart = parseInt(rows[0]), rowEnd = parseInt(rows[rows.length - 1])
            for(let i = rowStart; i < rowEnd + 1; i++) {
                const rHeight = sheet.getRowHeight(i)
                if(rHeight !== 20) {
                    differentHeight += rHeight
                    --rowCount
                }
            }
            return (rowCount * 21 + differentHeight)
        };

        getSpreadWidth = function (columns, columnCount) {
            const sheet = spread.getActiveSheet()
            let differentWidth = 0
            const columnStart = parseInt(columns[0]), columnEnd = parseInt(columns[columns.length - 1])
            for(let i = columnStart; i < columnEnd + 1; i++) {
                const cWidth = sheet.getColumnWidth(i)
                if(cWidth !== 62) {
                    differentWidth += cWidth
                    --columnCount
                }
            }
            return (columnCount * 62 + differentWidth)
        };
        
        exportLatestImg = async function () {
            await html2canvas(document.body).then(function(canvas) {
                image = canvas.toDataURL('image/png');
            });
            return image;
        };

        getData = function () {
            return JSON.stringify(spread.toJSON());
        };

        scaleSheet = function (zoom) {
            var sheet = spread.getActiveSheet()
            sheet.zoom(zoom)
        };
        
        cutTable = function (options) {
            var sheet = spread.getActiveSheet()
            sheet.deleteRows(options.rowIndex, options.rowCount)
            sheet.deleteColumns(options.columnIndex, options.columnCount)
        }

        setData = function (data) {
            spread.fromJSON(data);
            var sheet = spread.getActiveSheet(), options = sheet.options;
            spread.options.showVerticalScrollbar = false;
            spread.options.showHorizontalScrollbar = false;
            spread.options.tabStripVisible = false;
            spread.options.hideSelection = true;
            spread.options.scrollbarMaxAlign = true;
            spread.options.scrollbarShowMax = true;
            sheet.options.rowHeaderVisible = false;
            sheet.options.colHeaderVisible = false;
            options.protectionOptions = {
                allowSelectLockedCells: false,
                allowSelectUnlockedCells: false,
                allowFilter: false,
                allowSort: false,
                allowResizeRows: false,
                allowResizeColumns: false,
                allowEditObjects: false,
                allowDragInsertRows: false,
                allowDragInsertColumns: false,
                allowInsertRows: false,
                allowInsertColumns: false,
                allowDeleteRows: false,
                allowDeleteColumns: false
            };
            options.isProtected = true;
            sheet.clearSelection();
        };
        setData(JSON.parse(option.value));
        
        spread.getActiveSheet().clearSelection();
        
         html2canvas(document.body, {
            onrendered: function(canvas) {
                image = canvas.toDataURL('image/png');
            }
        });

        callback && callback();
    };
</script>
